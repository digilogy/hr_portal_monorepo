services:
  postgres:
    image: postgres:16-alpine
    container_name: hr-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-hr-portal}
      POSTGRES_USER: ${DB_USER:-hr_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hr_secure_password}
      TZ: Asia/Kolkata
    ports:
      - "5435:5432"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - postgresdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-hr_user}", "-d", "${DB_NAME:-hr-portal}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hr-redis
    ports:
      - "6380:6379"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: hr-api
    ports:
      - "5111:5111"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    sysctls:
      net.core.somaxconn: 65535
      net.ipv4.ip_local_port_range: "1024 65535"
    environment:
      NODE_OPTIONS: "--max-old-space-size=4096"
      NODE_ENV: development
      PORT: 5111
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-hr_user}
      DB_PASSWORD: ${DB_PASSWORD:-hr_secure_password}
      DB_NAME: ${DB_NAME:-hr-portal}
      DATABASE_URL: postgresql://${DB_USER:-hr_user}:${DB_PASSWORD:-hr_secure_password}@postgres:5432/${DB_NAME:-hr-portal}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TLS: "false"
      JWT_SECRET: ${JWT_SECRET:-850c75a6bdb414abb2ca0a0edf05fb2ddff761b07d515bdd4701cd40f3e9a61f}
      ADMIN_USER: ${ADMIN_USER:-admin@casagrand.co.in}
      ADMIN_PIN: ${ADMIN_PIN:-1234}
      FRONTEND_URL: http://localhost:3661
      ALLOWED_ORIGINS: http://localhost:3661
      AWS_REGION: ${AWS_REGION:-ap-south-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-AKIAQIJRSM7V3VJV3MME}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-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}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-support@digilogy.co}
      TZ: Asia/Kolkata
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mail-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/mail-worker.Dockerfile
    container_name: hr-mail-worker
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-hr_user}
      DB_PASSWORD: ${DB_PASSWORD:-hr_secure_password}
      DB_NAME: ${DB_NAME:-hr-portal}
      DATABASE_URL: postgresql://${DB_USER:-hr_user}:${DB_PASSWORD:-hr_secure_password}@postgres:5432/${DB_NAME:-hr-portal}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TLS: "false"
      JWT_SECRET: ${JWT_SECRET:-850c75a6bdb414abb2ca0a0edf05fb2ddff761b07d515bdd4701cd40f3e9a61f}
      AWS_REGION: ${AWS_REGION:-ap-south-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-AKIAQIJRSM7V3VJV3MME}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-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}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-support@digilogy.co}
      TZ: Asia/Kolkata
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy



volumes:
  postgresdata:
  redisdata:
