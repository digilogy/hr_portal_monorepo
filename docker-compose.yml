services:
  postgres:
    image: postgres:16-alpine
    container_name: hr-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-hr-portal}
      POSTGRES_USER: ${DB_USER:-hr_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hr_secure_password}
      TZ: Asia/Kolkata
    ports:
      - "5435:5432"
    volumes:
      - postgresdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-hr_user}", "-d", "${DB_NAME:-hr-portal}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hr-redis
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: hr-api
    ports:
      - "5111:5111"
    environment:
      NODE_ENV: development
      PORT: 5111
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-hr_user}
      DB_PASSWORD: ${DB_PASSWORD:-hr_secure_password}
      DB_NAME: ${DB_NAME:-hr-portal}
      DATABASE_URL: postgresql://${DB_USER:-hr_user}:${DB_PASSWORD:-hr_secure_password}@postgres:5432/${DB_NAME:-hr-portal}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PIN: ${ADMIN_PIN}
      FRONTEND_URL: http://localhost:3661
      ALLOWED_ORIGINS: http://localhost:3661
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL}
      TZ: Asia/Kolkata
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mail-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/mail-worker.Dockerfile
    container_name: hr-mail-worker
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-hr_user}
      DB_PASSWORD: ${DB_PASSWORD:-hr_secure_password}
      DB_NAME: ${DB_NAME:-hr-portal}
      DATABASE_URL: postgresql://${DB_USER:-hr_user}:${DB_PASSWORD:-hr_secure_password}@postgres:5432/${DB_NAME:-hr-portal}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL}
      TZ: Asia/Kolkata
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5111
    container_name: hr-frontend
    ports:
      - "3661:3661"
    environment:
      NODE_ENV: production
      PORT: 3661
    depends_on:
      - api

volumes:
  postgresdata:
  redisdata:
