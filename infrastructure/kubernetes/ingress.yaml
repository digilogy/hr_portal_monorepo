apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hr-ingress
  namespace: hr-portal
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  rules:
    - host: api.example.com
      http:
        paths:

          - path: /api
            pathType: Prefix
            backend:
              service:
                name: hr-api-service
                port:
                  number: 5111
