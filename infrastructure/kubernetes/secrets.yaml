apiVersion: v1
kind: Secret
metadata:
  name: hr-secrets
  namespace: hr-portal
type: Opaque
data:
  # Base64 encoded values for production keys
  DB_PASSWORD: "<INSERT_BASE64_DB_PASSWORD>"
  JWT_SECRET: "<INSERT_BASE64_JWT_SECRET>"
  ADMIN_USER: "<INSERT_BASE64_ADMIN_USER>"
  ADMIN_PIN: "<INSERT_BASE64_ADMIN_PIN>"
  AWS_ACCESS_KEY_ID: "<INSERT_BASE64_AWS_ACCESS_KEY>"
  AWS_SECRET_ACCESS_KEY: "<INSERT_BASE64_AWS_SECRET_KEY>"
