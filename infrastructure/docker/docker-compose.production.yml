services:
  redis:
    image: redis:7-alpine
    container_name: timesheet-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - timesheet-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  timesheet-reports:
    image: timesheet-reports:arm64
    container_name: timesheet-reports
    restart: always
    environment:
      - PORT=5112
    env_file:
      - .env
    ports:
      - "127.0.0.1:5112:5112"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - timesheet-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5112/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  timesheet-admin:
    image: timesheet-admin:arm64
    container_name: timesheet-admin
    restart: always
    environment:
      - PORT=5113
    env_file:
      - .env
    ports:
      - "127.0.0.1:5113:5113"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - timesheet-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5113/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  timesheet-mail-worker:
    image: timesheet-mail-worker:arm64
    container_name: timesheet-mail-worker
    restart: always
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - timesheet-net
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  timesheet-api:
    image: timesheet-api:arm64
    container_name: timesheet-api
    restart: always
    environment:
      - PORT=5111
    env_file:
      - .env
    ports:
      - "127.0.0.1:5111:5111"
    depends_on:
      redis:
        condition: service_healthy
      timesheet-reports:
        condition: service_healthy
      timesheet-admin:
        condition: service_healthy
    networks:
      - timesheet-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5111/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  timesheet-net:
    driver: bridge

volumes:
  redis_data:
